# Builds, tests and packages the desktop app on real macOS and Windows machines.
#
# - Every push / pull request: build the engine, run unit + integration tests and the UI test.
# - Tags like v1.0.0: also build the installers and attach them to a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            engine: mac
            dist: dist:mac
          - os: windows-latest
            engine: win
            dist: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: mlugg/setup-zig@v2
        if: matrix.engine == 'win'

      - name: Build native engine
        run: bash scripts/build-engine.sh ${{ matrix.engine }}

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: UI end-to-end test
        run: npm run test:e2e

      - name: Package installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run ${{ matrix.dist }}
        env:
          # No signing certificates are configured; see docs/BUILDING.md to add them.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.engine }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
