# Builds, tests and packages the desktop app on real macOS and Windows machines.
#
# - Every push / pull request: build the engine, run unit + integration tests and the UI test.
# - Tags like v1.0.0: also build the installers and attach them to a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            engine: mac
            dist: dist:mac
          - os: windows-latest
            engine: win
            dist: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # zig cross-compiles the Windows engine. Installed with Chocolatey (preinstalled on Windows
      # runners) rather than mlugg/setup-zig, whose releases still run on the deprecated Node 20.
      - name: Install zig
        if: matrix.engine == 'win'
        run: |
          choco install zig --version 0.16.0 --no-progress -y
          zig version

      - name: Build native engine
        run: bash scripts/build-engine.sh ${{ matrix.engine }}

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: UI end-to-end test
        run: npm run test:e2e

      - name: Package installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run ${{ matrix.dist }}
        env:
          # No signing certificates are configured; see docs/BUILDING.md to add them.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.engine }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
